name: Verify NestJS
on:
  push:
    branches:
      - fix/storage-access-security
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
        env:
          NODE_OPTIONS: --experimental-vm-modules
